# =============================================================================
# 10-gzip-static.conf   —   OPTIONAL
#
# Install to: /etc/nginx/aref-optional/10-gzip-static.conf
#
# WHAT IT DOES
#   Our build step writes a pre-compressed "file.gz" next to every text file it
#   ships. This directive tells nginx to send that ready-made copy to browsers
#   that accept gzip, instead of compressing the original on every request.
#   For this site that is the difference between roughly 227 MB and 33 MB of
#   files, at zero CPU cost per request.
#
#   If the .gz copy is missing for some file, nginx quietly falls back to
#   compressing it on the fly (configured in the main server block), and if the
#   browser does not accept gzip it gets the plain original. Nothing breaks.
#
# REQUIREMENT
#   The ngx_http_gzip_static_module, which is NOT part of a default nginx build.
#   To check before installing this file:
#
#       nginx -V 2>&1 | tr ' ' '\n' | grep http_gzip_static_module
#
#   If that prints nothing, your nginx does not have it. Most distribution
#   packages (Debian/Ubuntu nginx-full or nginx-core, RHEL/Rocky nginx) do
#   include it.
#
# IF IT IS NOT AVAILABLE
#   `nginx -t` will report: unknown directive "gzip_static".
#   Delete this file. The site works without it — nginx will compress on the
#   fly instead, costing some CPU but nothing else.
#
# NOT USED HERE: `gzip_static always`. That variant skips checking whether the
#   browser can accept gzip, and is only safe when no plain files exist on disk.
#   Ours do, so plain `on` is correct.
# =============================================================================

gzip_static on;
