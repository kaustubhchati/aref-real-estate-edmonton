# =============================================================================
# 20-brotli-static.conf   —   OPTIONAL, and genuinely optional
#
# Install to: /etc/nginx/aref-optional/20-brotli-static.conf
#
# WHAT IT DOES
#   Exactly what 10-gzip-static.conf does, but for Brotli, a newer compression
#   format that every current browser supports. Our build writes a "file.br"
#   alongside each "file.gz". Brotli is meaningfully smaller on our data:
#   about 19 MB against gzip's 33 MB for the same files.
#
#   nginx prefers .br when the browser accepts it, falls back to .gz, then to
#   the plain file. Installing this alongside 10-gzip-static.conf is the ideal
#   arrangement; installing neither is perfectly workable.
#
# REQUIREMENT
#   The third-party ngx_brotli module, which is NOT part of nginx and has no
#   build flag in nginx itself. It is packaged on some distributions, e.g.
#
#       Debian / Ubuntu :  apt install libnginx-mod-brotli
#
#   Distribution packages install the module and register it automatically; no
#   `load_module` line is needed in this file (and one could not go here in any
#   case — that directive is only valid at the very top of nginx.conf).
#
# PLEASE DO NOT BUILD NGINX FROM SOURCE FOR THIS
#   If ngx_brotli is not packaged for your platform, we would much rather go
#   without it. A source-built nginx stops receiving your distribution's
#   security updates, and that is a poor trade for a file-size improvement.
#   Skip this file and keep gzip.
#
# IF IT IS NOT AVAILABLE
#   `nginx -t` will report: unknown directive "brotli_static".
#   Delete this file. Nothing else needs changing.
#
# ONE THING WORTH CHECKING IF A SHARED CACHE OR CDN SITS IN FRONT OF THIS BOX:
#   we were not able to confirm from the module's documentation whether it adds
#   a `Vary: Accept-Encoding` header of its own. The main server block sets
#   `gzip_vary on`, which covers the gzip path. If you front this site with a
#   shared cache, please confirm a .br response carries that header.
# =============================================================================

brotli_static on;
