# =============================================================================
# aref-realestate.conf
# nginx server configuration for the Open Data Centre for Alberta Urban Real
# Estate — a plain static website.
#
# WHAT THIS SITE IS
#   HTML, CSS, JavaScript and a large set of map-data files (GeoJSON and CSV).
#   There is no application server, no database, no PHP and no Node.js. nginx
#   reads files from disk and sends them; that is the whole of it.
#
# WHERE THIS FILE GOES
#   Debian / Ubuntu : /etc/nginx/sites-available/aref-realestate.conf
#                     then: ln -s ../sites-available/aref-realestate.conf \
#                                 /etc/nginx/sites-enabled/
#   RHEL / Rocky    : /etc/nginx/conf.d/aref-realestate.conf
#
#   Please do NOT replace the distribution's own /etc/nginx/nginx.conf. This
#   file is designed to sit alongside it. Worker counts, logging and every
#   other global setting stay under your control.
#
# WHAT YOU MUST EDIT
#   Three placeholders, each marked « CHANGE ME ». Nothing else needs editing.
#
# TWO CHOICES THAT MAY LOOK UNUSUAL — both deliberate
#   1. Compression is pre-computed, not done per request. The build step writes
#      a .gz (and .br) copy next to every text file, so nginx never spends CPU
#      compressing our 219 MB of map data. See "COMPRESSION" below.
#   2. The directives that serve those pre-made copies are pulled in through a
#      WILDCARD include of an optional directory. This is a safety measure: if
#      your nginx lacks one of those modules, a wildcard include that matches
#      nothing is silently ignored, whereas writing the directive directly
#      would abort nginx at startup. See "OPTIONAL MODULES" below.
#
# TESTED AGAINST  nginx 1.31.3. Every directive used here has existed for many
#   years and is present in nginx 1.18+ (Ubuntu 20.04 and newer, Debian 11 and
#   newer, RHEL 8 and newer). Nothing here needs a recent nginx.
# =============================================================================


# -----------------------------------------------------------------------------
# BLOCK 1 of 2 — redirect plain HTTP to HTTPS.
#
# If TLS is terminated somewhere else (a load balancer or reverse proxy in
# front of this machine), DELETE THIS ENTIRE BLOCK and see the note at the top
# of block 2.
# -----------------------------------------------------------------------------
server {
    listen      80;
    server_name realestatedata.srv.ualberta.ca;   # « CHANGE ME » (1 of 3)

    # $host is the hostname the browser actually asked for, so this redirect
    # keeps working if the site is reached under more than one name.
    return 301 https://$host$request_uri;
}


# -----------------------------------------------------------------------------
# BLOCK 2 of 2 — the site itself.
#
# IF TLS IS TERMINATED UPSTREAM: delete block 1 above, then in this block
# replace the four TLS lines below with a single `listen 80;`.
# -----------------------------------------------------------------------------
server {

    # ── TLS ──────────────────────────────────────────────────────────────────
    # IST supplies the certificate for ualberta.ca. Point these at wherever you
    # install it. (HTTP/2 is deliberately not enabled here: the directive to do
    # so changed name in nginx 1.25 and we do not know your version. Adding it
    # is a safe, optional improvement — see the covering note.)
    listen              443 ssl;
    ssl_certificate     /etc/ssl/certs/aref-realestate.crt;      # « CHANGE ME » (2 of 3)
    ssl_certificate_key /etc/ssl/private/aref-realestate.key;    # « CHANGE ME » (3 of 3)
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # modern practice: let the client choose
    # ── end TLS ──────────────────────────────────────────────────────────────

    server_name realestatedata.srv.ualberta.ca;   # same hostname as block 1

    # ── Document root ────────────────────────────────────────────────────────
    # BASE-PATH 1 of 3. The site's files live directly under this directory
    # (index.html, assets/, data/, ...).
    #
    # This may safely be a SYMLINK. Our deploy process publishes each release
    # into a timestamped directory and then re-points `current` at it, so that
    # visitors always see one complete release and never a half-copied mix.
    # For that to work, please leave nginx's `disable_symlinks` at its default
    # (off). It is the one setting that would break us.
    root /var/www/aref/current;

    index index.html;

    # ── Hygiene ──────────────────────────────────────────────────────────────
    server_tokens off;   # do not advertise the nginx version in headers/errors

    charset       utf-8;
    charset_types text/css text/plain text/xml application/javascript
                  application/json application/geo+json text/csv;

    # Directory listings stay off (this is also nginx's default; stated
    # explicitly so it cannot be turned on by accident at a higher level).
    autoindex off;

    # IMPORTANT: do NOT add `error_page 404 /index.html;` to this server.
    # It would convert every missing data file into an HTML page, which is the
    # exact failure the /data/ rules below are written to prevent.


    # ── COMPRESSION ──────────────────────────────────────────────────────────
    # On-the-fly gzip. This is the FALLBACK path, used for the handful of small
    # files that the build step does not pre-compress (anything under 1 KB).
    # The bulk of the site is served from pre-made .gz/.br copies instead —
    # see OPTIONAL MODULES below.
    gzip on;

    # `Vary: Accept-Encoding` is NOT emitted unless this is on, and it is off by
    # default. Without it a shared cache can hand a compressed response to a
    # client that cannot read it. This setting also covers the pre-made copies.
    gzip_vary on;

    # Default is `off`, which means nginx skips compression entirely for any
    # request carrying a `Via` header — i.e. anything arriving through a campus
    # reverse proxy or CDN. That would silently disable compression, including
    # the pre-made copies. `any` keeps it working in front of a proxy.
    gzip_proxied any;

    gzip_comp_level 5;      # 1-9; 5 is the usual speed/size sweet spot
    gzip_min_length 1024;   # below this, compression costs more than it saves

    # text/html is always compressed and does not need listing here.
    # application/geo+json and text/csv only work because the location blocks
    # further down give those extensions a real MIME type — nginx matches this
    # list against the response Content-Type, and by default .geojson and .csv
    # have no type at all.
    gzip_types application/geo+json application/json text/csv text/plain
               text/css application/javascript image/svg+xml;

    # ── OPTIONAL MODULES ─────────────────────────────────────────────────────
    # This pulls in `gzip_static` and/or `brotli_static`, which make nginx serve
    # the pre-compressed copies the build step already produced.
    #
    # WHY IT IS AN INCLUDE AND NOT JUST TWO LINES HERE:
    #   Writing `brotli_static on;` on a machine without the brotli module makes
    #   nginx refuse to start — it aborts with `unknown directive`, taking down
    #   every site on the machine, not only this one. A wildcard include that
    #   matches no files is silently ignored, so this construction cannot ever
    #   stop nginx starting. The directory below does not even need to exist.
    #
    # TO ENABLE: copy the snippet files from the `optional/` folder shipped with
    #   this config into /etc/nginx/aref-optional/, then run `nginx -t`. If a
    #   snippet is rejected, that module is not available — simply delete that
    #   one file. The site works either way; without them it is slower, not
    #   broken.
    #
    # NOTE: `nginx -t` passing does NOT prove the snippets were picked up (an
    #   include that matches nothing also passes). Verify with the curl checks
    #   in the covering note.
    include /etc/nginx/aref-optional/*.conf;


    # ═════════════════════════════════════════════════════════════════════════
    # ROUTING AND CACHING
    #
    # A note on ordering, because nginx's rules are not obvious: blocks written
    # `location ~ ...` are REGULAR EXPRESSIONS, and nginx tries them in the
    # order they appear here, taking the first that matches. Blocks written
    # `location /foo/` are plain prefixes and their order in the file does not
    # matter. So the regex blocks below must stay in the order given.
    # ═════════════════════════════════════════════════════════════════════════

    # 1. Refuse hidden files. Our build occasionally picks up macOS metadata
    #    (.DS_Store) and similar; none of it should ever be public. This must
    #    stay first so it wins over the rules beneath it.
    #    The .well-known exception below is exempt (see rule 2).
    location ~ /\. {
        deny all;
    }

    # 2. Certificate-renewal challenges, if you ever use them. `^~` makes this
    #    win over the hidden-file rule above, which would otherwise block it.
    location ^~ /.well-known/ {
        try_files $uri =404;
    }

    # 3. Two files our build emits for a different hosting provider. They are
    #    inert here and simply describe our caching policy, so they are not
    #    served.
    location ~ /_(headers|redirects)$ {
        deny all;
    }

    # 4. Map data — GeoJSON. This is the site's bulk (about 220 MB across 71
    #    files) and it lives in more than one folder, so it is matched by
    #    extension rather than by folder.
    #
    #    `types { }` empties the extension-to-type table WITHIN THIS BLOCK ONLY
    #    and `default_type` then supplies the correct type. This is nginx's own
    #    documented way to set a type for one kind of file, and it is used here
    #    precisely because it cannot affect any other extension anywhere else.
    #    Without it .geojson is served as a nameless binary download and is not
    #    compressed at all.
    #
    #    `try_files $uri =404;` is a correctness requirement, not tidiness: a
    #    missing data file must return a clean 404. If it instead fell through
    #    to the page-routing rule at the bottom it would return the website's
    #    HTML with a success code, and the browser would report a confusing
    #    parse error instead of an obvious missing file.
    location ~* \.geojson$ {
        types { }
        default_type application/geo+json;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # 5. Downloadable and internal CSV tables. Same reasoning as rule 4; stock
    #    nginx has no mapping for .csv either.
    location ~* \.csv$ {
        types { }
        default_type text/csv;
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # 6. Small JSON index files that tell the site which data years exist.
    #    nginx already knows this extension, so no type override is needed.
    location ~* \.json$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # 7. Images and fonts served outside the versioned assets folder.
    location ~* \.(?:jpg|jpeg|png|svg|ico|webp|woff2)$ {
        add_header Cache-Control "public, max-age=3600, must-revalidate" always;
        try_files $uri =404;
    }

    # 8. The build's own JavaScript/CSS bundle. Every filename here contains a
    #    content fingerprint (index-C9a_S3rj.js), so a changed file is a NEW
    #    filename and these can be cached indefinitely with no staleness risk.
    #    `^~` stops the extension rules above from claiming them.
    #    BASE-PATH 2 of 3.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 9. The site's entry page. It must always be re-checked, because it names
    #    the fingerprinted files from rule 8 — a cached copy would point at
    #    filenames that no longer exist after an update, and the site would
    #    appear broken with no error message.
    location ~* /index\.html$ {
        add_header Cache-Control "no-cache" always;
    }

    # 10. Everything else: page routing.
    #     This site does its own navigation in the browser, so addresses such as
    #     /properties/zoning are not real files. Serving index.html for them
    #     lets a bookmarked or shared link work. Real files are still served
    #     normally — this only catches addresses that match nothing on disk, and
    #     it can never catch the data files, which are handled by rules 4-7.
    #     BASE-PATH 3 of 3.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# =============================================================================
# SERVING THE SITE UNDER A SUB-PATH (e.g. a preview at /realestate/)
#
# The site must be built for the address it is served from, so tell us the
# exact preview URL first. On this side, exactly three lines change — each is
# tagged « BASE-PATH » above:
#   1. root       → keep as-is, and place the site's files in a `realestate`
#                   sub-folder underneath it
#   2. location ^~ /assets/      → location ^~ /realestate/assets/
#   3. location /                → location /realestate/
# The extension-based rules (4-7 and 9) need no change; they already work at
# any depth.
# =============================================================================
