# _whirl.yaml — section run configuration for the AREF pipeline.
# -----------------------------------------------------------------------------
# Authoritative source of (1) each section's working directory and (2) the
# dependency-ordered script sequence within it. The runner (run_section.R)
# reads this; cwd is declared HERE and is NEVER derived from .Rproj presence.
# Repo root (and thus this file) is located via the .aref_root sentinel.
# -----------------------------------------------------------------------------

sections:
  property-assessment:
    # Authoritative working directory for this section, repo-root-relative.
    # Every script's bare-relative data/ and output/ path resolves against this.
    # Declared explicitly — do NOT infer it from an .Rproj file.
    cwd: pipeline/property-assessment

    # Scripts in DEPENDENCY order — NOT numeric filename order.
    # Each path is relative to `cwd` above.
    scripts:
      - scripts/production/01_load_data.R
      - scripts/production/06_apply_layer1a_rules.R
      - scripts/production/07a_build_hist_clean.R
      # --- 08d MUST run BEFORE 07 (dependency, not numeric, order) ---
      # 07 reads 08d's prior-year output
      #   output/hist_aggregates/neighbourhood_aggregates_2025.csv
      # to compute the yoy_pct_change column. In numeric order (07 before 08d)
      # that file does not yet exist on a clean run, so 07's file.exists guard
      # falls through to a warning and SILENTLY nulls yoy_pct_change.
      # A future reader must NOT "correct" this back to numeric order.
      - scripts/production/08d_hist_aggregate.R
      - scripts/production/07_layer2_aggregates.R
      # 08_build_geojson.R removed 2026-06-22: it built a pre-rescue geojson the
      # frontend never consumed. 08b is the sole current-year builder now.
      - scripts/production/08b_name_fallback_rescue.R
      - scripts/production/08e_hist_build_geojson.R
      - scripts/production/09a_emit_manifest.R

    # Order invariants (data-driven; consumed by the dry-run check in
    # _run_engine.R). Each {before, after} pair must appear in that order in the
    # scripts list above — this encodes the 08d-before-07 dependency documented
    # there. Sections without this key carry no ordering constraint (and so no
    # longer mis-fail the dry run, as they did under the old hardcoded check).
    order_invariants:
      - before: scripts/production/08d_hist_aggregate.R
        after:  scripts/production/07_layer2_aggregates.R

    # --- Handoff: publish output/ -> website/public after ALL scripts succeed ---
    # The runner is now the SOLE writer of website/public. 08e/08b write the
    # per-year GeoJSONs to output/ (uniform neighbourhoods_<YYYY>_recovered.geojson
    # name); 09a writes output/manifest.json. This block declares the publish:
    # for every year the manifest lists, identity-copy that GeoJSON to public,
    # then publish the manifest. Manifest-driven — no year literals. {year} is the
    # placeholder the runner fills from the manifest.
    handoff:
      manifest:        output/manifest.json                         # cwd-relative; the year source (09a)
      geojson_src_dir: output                                       # cwd-relative; where 08e/08b wrote
      geojson_pattern: neighbourhoods_{year}_recovered.geojson      # {year} <- manifest years
      dest_dir:        website/public/data/property-assessment      # repo-root-relative
      manifest_dest:   website/public/manifest.json                 # repo-root-relative
      # Frontend-served CSVs published from the one produced source (was manual,
      # which let public drift on refresh). Report Card reads /data/...; the
      # Download page reads /downloads/... — both copies come from here now.
      files:
        - { from: output/neighbourhood_aggregates_2026.csv, to: website/public/data/neighbourhood_aggregates_2026.csv }
        - { from: output/neighbourhood_aggregates_2026.csv, to: website/public/downloads/neighbourhood_aggregates_2026.csv }

  building-permits:
    cwd: pipeline/building-permits

    # Dependency order: 02 fetches today's snapshot + builds the point geojson +
    # coverage/category CSVs (using the COMMITTED job_category_grouping; 02 self-
    # guards category drift via its n_unmapped stop). 03 reads that fresh snapshot
    # + boundary -> per-year aggregates + choropleth geojsons. 04 emits the manifest.
    scripts:
      - scripts/production/02_build_permits.R
      - scripts/production/03_build_permit_aggregates.R
      - scripts/production/04_emit_manifest.R
    # 02a_build_job_grouping.R is NOT in the routine chain — it is an out-of-band
    # re-curation tool, run only when 02's n_unmapped guard trips (the City adds a
    # JOB_CATEGORY the committed grouping doesn't cover). Re-run it against a present
    # snapshot, commit the new dated grouping, then run this chain. (Same spirit as
    # 08c sitting in property-assessment/scripts/_oneshot/.)

    # --- Handoff (Way A: glob + fixed-file copy; never parses the manifest) -----
    # The runner copies what PHYSICALLY EXISTS in output/, not what a manifest
    # lists. The BP manifest is copied as a fixed file (it feeds the frontend's
    # year discovery) — not read here. Published to a SECTION-scoped manifest path
    # (PA owns the global /manifest.json).
    handoff:
      glob:
        # Directory remap: output/permit_geojson/ -> public's permit-neighbourhoods/
        # (filenames identical). Copies the full per-year set 03 produced.
        - src_dir:  output/permit_geojson
          dest_dir: website/public/data/building-permits/permit-neighbourhoods
          pattern:  "permit_neighbourhoods_*.geojson"
      files:
        - { from: output/permits_coverage.csv,        to: website/public/data/building-permits/permits_coverage.csv }
        - { from: output/permits_category_counts.csv, to: website/public/data/building-permits/permits_category_counts.csv }
        - { from: output/manifest.json,               to: website/public/data/building-permits/manifest.json }
        # Download-page copies (siteConfig serves these from /downloads/); was
        # manual placement, now published from the one produced source.
        - { from: output/permits_coverage.csv,        to: website/public/downloads/permits_coverage.csv }
        - { from: output/permits_category_counts.csv, to: website/public/downloads/permits_category_counts.csv }
