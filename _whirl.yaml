# _whirl.yaml — section run configuration for the AREF pipeline.
# -----------------------------------------------------------------------------
# Authoritative source of (1) each section's working directory and (2) the
# dependency-ordered script sequence within it. The runner (run_section.R)
# reads this; cwd is declared HERE and is NEVER derived from .Rproj presence.
# Repo root (and thus this file) is located via the .aref_root sentinel.
# -----------------------------------------------------------------------------

sections:
  property-assessment:
    # Authoritative working directory for this section, repo-root-relative.
    # Every script's bare-relative data/ and output/ path resolves against this.
    # Declared explicitly — do NOT infer it from an .Rproj file.
    cwd: pipeline/yeg/property-assessment

    # Scripts in DEPENDENCY order. After the Jun-2026 rename the 01..08 prefixes
    # now coincide with this run order, but the prefix is only a stable
    # lexical-sort handle — run order is THIS list, authoritative. Do not infer
    # order from the numbers, and do not reorder a step to "match" them.
    # Each path is relative to `cwd` above.
    scripts:
      - scripts/production/01_fetch_current.R
      - scripts/production/02_clean_current.R
      - scripts/production/03_clean_historical.R
      # --- 04_aggregate_historical MUST run BEFORE 05_aggregate_current (dependency) ---
      # 05 reads 04's prior-year output
      #   output/hist_aggregates/neighbourhood_aggregates_2025.csv
      # to compute the yoy_log_points column. If 05 ran first, that file would not
      # yet exist on a clean run, so 05's file.exists guard falls through to a
      # warning and SILENTLY nulls yoy_log_points. Keep 04 ahead of 05.
      - scripts/production/04_aggregate_historical.R
      - scripts/production/05_aggregate_current.R
      # 08_build_geojson.R removed 2026-06-22: it built a pre-rescue geojson the
      # frontend never consumed. 06_geojson_current is the sole current-year builder now.
      - scripts/production/06_geojson_current.R
      - scripts/production/07_geojson_historical.R
      # 07b reshapes the per-year GeoJSONs 06+07 wrote into ONE geometry-once
      # file (neighbourhoods_all_years.geojson) carrying every year's values as
      # <metric>_<year> / polygon_state_<year> properties, for the year-slider
      # paint-swap. ADDITIVE: 06/07 still emit the per-year files the frontend
      # consumes today; 07b publishes the combined file alongside. It reads only
      # 06/07's outputs, so it runs after them.
      - scripts/production/07b_combine_geojson.R
      - scripts/production/08_emit_manifest.R

    # Order invariants (data-driven; consumed by the dry-run check in
    # _run_engine.R). Each {before, after} pair must appear in that order in the
    # scripts list above — this encodes the 04-before-05 dependency documented
    # there. Sections without this key carry no ordering constraint (and so no
    # longer mis-fail the dry run, as they did under the old hardcoded check).
    order_invariants:
      - before: scripts/production/04_aggregate_historical.R
        after:  scripts/production/05_aggregate_current.R

    # Expected outputs (data-driven; checked by the expected-outputs guard in
    # _run_engine.R). Map each producing script to the cwd-relative outputs it
    # must leave NON-EMPTY. A missing/zero-byte declared output flags that script
    # ok_empty_output (the chain continues) and the handoff refuses to publish it.
    # The handoff's own zero-byte check backstops EVERY published file regardless;
    # this map is the earlier, script-level signal for the key products.
    # (07_geojson_historical builds 2012-2025; the two endpoints below are a
    # representative guard — the handoff size check covers the in-between years.)
    expected_outputs:
      scripts/production/05_aggregate_current.R:
        - output/neighbourhood_aggregates_2026.csv
      scripts/production/06_geojson_current.R:
        - output/neighbourhoods_2026_recovered.geojson
      scripts/production/07_geojson_historical.R:
        - output/neighbourhoods_2012_recovered.geojson
        - output/neighbourhoods_2025_recovered.geojson
      scripts/production/07b_combine_geojson.R:
        - output/neighbourhoods_all_years.geojson

    # --- Handoff: publish output/ -> website/public after ALL scripts succeed ---
    # The runner is now the SOLE writer of website/public. 07_geojson_historical
    # and 06_geojson_current write the per-year GeoJSONs to output/ (uniform
    # neighbourhoods_<YYYY>_recovered.geojson name); 08_emit_manifest writes
    # output/manifest.json. This block declares the publish:
    # for every year the manifest lists, identity-copy that GeoJSON to public,
    # then publish the manifest. Manifest-driven — no year literals. {year} is the
    # placeholder the runner fills from the manifest.
    handoff:
      manifest:        output/manifest.json                         # cwd-relative; the year source (09a)
      geojson_src_dir: output                                       # cwd-relative; where 07/06 geojson builders wrote
      geojson_pattern: neighbourhoods_{year}_recovered.geojson      # {year} <- manifest years
      dest_dir:        website/public/data/property-assessment      # repo-root-relative
      manifest_dest:   website/public/manifest.json                 # repo-root-relative
      # Frontend-served CSVs published from the one produced source (was manual,
      # which let public drift on refresh). Report Card reads /data/...; the
      # Download page reads /downloads/... — both copies come from here now.
      # PUBLISH-TIME RENAME to the locked standard (CLAUDE.md §6 / docs/STRUCTURE.md):
      # the produced frame stays unprefixed in output/ (internal); the PUBLISHED
      # artifact carries the yeg_ city prefix + section + _per_nbhd + data year:
      #   yeg_<section>[_per_nbhd]_<dataYear>.csv
      files:
        # {year} is resolved by the runner from the file that EXISTS in output/,
        # newest wins, and the same year lands in the published name. Without it
        # a rollover would leave these pointing at last year's file and publish
        # nothing at all.
        # NOTE the quotes: unquoted, YAML reads a leading `{` inside a flow
        # mapping as a nested mapping and the file stops parsing.
        - { from: "output/neighbourhood_aggregates_{year}.csv", to: "website/public/data/yeg_property-assessment_per_nbhd_{year}.csv" }
        - { from: "output/neighbourhood_aggregates_{year}.csv", to: "website/public/downloads/yeg_property-assessment_per_nbhd_{year}.csv" }
        # Combined all-years choropleth (07b) — published alongside the per-year
        # GeoJSONs (above, via the manifest-year loop) for the year-slider
        # paint-swap. Name carries no year/span (literal-free, frontend-stable).
        - { from: output/neighbourhoods_all_years.geojson, to: website/public/data/property-assessment/neighbourhoods_all_years.geojson }

  building-permits:
    cwd: pipeline/yeg/building-permits

    # Dependency order: 01 fetches today's snapshot + builds the point geojson +
    # coverage/category CSVs (using the COMMITTED job_category_grouping; 01 self-
    # guards category drift via its n_unmapped stop). 02 reads that fresh snapshot
    # + boundary -> per-year aggregates + choropleth geojsons. 02b reshapes those
    # per-year geojsons into ONE combined all-years file (the Data Console's
    # resident source — same additive reshape as PA's 07b, makes no data decisions).
    # 03 emits the manifest.
    scripts:
      - scripts/production/01_build_permits.R
      - scripts/production/02_build_permit_aggregates.R
      - scripts/production/02b_combine_geojson.R
      - scripts/production/03_emit_manifest.R
    # 01a_build_job_grouping.R is NOT in the routine chain — it is an out-of-band
    # re-curation tool, run only when 01's n_unmapped guard trips (the City adds a
    # JOB_CATEGORY the committed grouping doesn't cover). Re-run it against a present
    # snapshot, commit the new dated grouping, then run this chain. (Same spirit as
    # 08c sitting in property-assessment/scripts/_oneshot/.)

    # --- Handoff (Way A: glob + fixed-file copy; never parses the manifest) -----
    # The runner copies what PHYSICALLY EXISTS in output/, not what a manifest
    # lists. The BP manifest is copied as a fixed file (it feeds the frontend's
    # year discovery) — not read here. Published to a SECTION-scoped manifest path
    # (PA owns the global /manifest.json).
    handoff:
      glob:
        # Directory remap: output/permit_geojson/ -> public's permit-neighbourhoods/
        # (filenames identical). The ???? matches the 4-digit YEAR ONLY, so the
        # per-year files publish here; the combined permit_neighbourhoods_all_years
        # .geojson (02b) is published by an explicit files: entry below instead, so
        # the year-only glob deliberately does NOT sweep it (no double-copy).
        # NB: glob2rx escapes "[", so ???? — not [0-9]* — is the year-only match.
        - src_dir:  output/permit_geojson
          dest_dir: website/public/data/building-permits/permit-neighbourhoods
          pattern:  "permit_neighbourhoods_????.geojson"
        # Point map per-year files (01's 4b2 emit): output/permit_points/ -> public's
        # permit-points/. Same dir-remap shape + year-only ???? as the choropleths;
        # per-year (not one all-years file) keeps each under Pages' 25 MiB cap.
        - src_dir:  output/permit_points
          dest_dir: website/public/data/building-permits/permit-points
          pattern:  "permit_points_????.geojson"
      # PUBLISH-TIME RENAME to the locked CSV naming standard (CLAUDE.md §6):
      # output/ frames stay unprefixed (internal); the PUBLISHED copy carries the
      # yeg_ city prefix + section + descriptor. These are all-years rolling files,
      # so they take no year/span suffix (a span would be a forbidden date literal
      # / break the frontend URL on rollover). manifest.json is not a CSV — kept as-is.
      files:
        # The combined all-years GeoJSON (02b) — the Data Console's resident source.
        # A fixed-file copy (NOT the year-only glob above), mirroring PA's combined
        # handoff. Same dir as the per-year files on both sides.
        - { from: output/permit_geojson/permit_neighbourhoods_all_years.geojson, to: website/public/data/building-permits/permit-neighbourhoods/permit_neighbourhoods_all_years.geojson }
        - { from: output/permits_coverage.csv,        to: website/public/data/building-permits/yeg_building-permits_coverage.csv }
        - { from: output/permits_category_counts.csv, to: website/public/data/building-permits/yeg_building-permits_category_counts.csv }
        - { from: output/manifest.json,               to: website/public/data/building-permits/manifest.json }
        # Download-page copies (siteConfig serves these from /downloads/); was
        # manual placement, now published from the one produced source.
        - { from: output/permits_coverage.csv,        to: website/public/downloads/yeg_building-permits_coverage.csv }
        - { from: output/permits_category_counts.csv, to: website/public/downloads/yeg_building-permits_category_counts.csv }

  business-census:
    cwd: pipeline/yeg/economy/business-census

    # TWO maps, TWO source datasets, one section:
    # 01 (choropleth) fetches the pre-aggregated Business Census (wh44-4bkz) +
    #    boundary (newest-by-glob), joins, writes the neighbourhood choropleth
    #    GeoJSON (+ flat CSV + build log) to output/.
    # 02 (points) reads the RAW business-level file (8c4b-u4a4) and writes a
    #    per-business points GeoJSON coloured by top-10 sector. 02 is READ-ONLY —
    #    it NEVER fetches (see the MANUAL PREREQUISITE below).
    # The two datasets now sit on DISTINCT filename stems in data/raw/: 01's fetch
    # writes Edmonton_Business_Census_Aggregation_<date>.csv, the raw stays
    # Edmonton_Business_Census_<date>.csv — so 02's newest-by-glob never grabs the
    # aggregate (a shared stem used to strand 02). Order is free (independent I/O);
    # listed choropleth-then-points.
    #
    # MANUAL PREREQUISITE (02): a CURRENT raw business-level snapshot
    #   data/raw/Edmonton_Business_Census_<YYYYMMDD>.csv (Socrata 8c4b-u4a4 — the
    #   ~52k-row / ~26 MB business-level export, NOT the aggregate) must be on disk
    #   before a refresh. It is KC-curated, not fetched. If the newest matching raw
    #   file is stale, 02 builds from it; if the newest is not business-level, 02's
    #   raw-marker guard STOPS loudly (never a silent mis-build).
    scripts:
      - scripts/production/01_build_business_census.R
      - scripts/production/02_build_business_census_points.R

    # --- Handoff: publish both GeoJSONs the frontend serves ---------------------
    # The runner is the SOLE publisher (§2). Choropleth -> a fixed-name files: copy
    # (BusinessCensusMap.jsx fetches /data/economy/business_census_2025.geojson;
    # year baked in, frontend-coupled, kept verbatim). Points -> a year-only glob
    # (business_census_points_????.geojson), literal-free + frontend-stable across a
    # vintage rollover, mirroring BP's per-year points glob. Flat CSV + build log
    # stay in output/ (not served).
    handoff:
      glob:
        - src_dir:  output
          dest_dir: website/public/data/economy
          pattern:  "business_census_points_????.geojson"
      files:
        - { from: output/business_census_2025.geojson, to: website/public/data/economy/business_census_2025.geojson }

  amenities:
    cwd: pipeline/yeg/amenities

    # ONE registry-driven emitter (01) builds every amenity map layer from the
    # dated amenity_layer_registry_<date>.csv (point/line/polygon, geometry-
    # agnostic); 03 emits the no-year currency manifest. (02 intentionally unused:
    # no aggregate step; 03 mirrors the building-permits "03 = manifest" convention.)
    scripts:
      - scripts/production/01_build_amenity_layers.R
      - scripts/production/02_build_lrt_lines.R
      - scripts/production/03_emit_manifest.R

    # Representative non-empty guards: a dense point layer + the line layer for 01, the LRT
    # route lines for 02, the manifest for 03. The handoff zero-byte check backstops every file.
    expected_outputs:
      scripts/production/01_build_amenity_layers.R:
        - output/playgrounds.geojson
        - output/bike_routes.geojson
      scripts/production/02_build_lrt_lines.R:
        - output/lrt_lines.geojson
      scripts/production/03_emit_manifest.R:
        - output/manifest.json

    # --- Handoff (Way A: glob + fixed-file copy) --------------------------------
    # Every emitted layer GeoJSON publishes via the year-free "*.geojson" glob;
    # the manifest is a fixed-file copy. The build log (_amenity_build_log.csv) is
    # NOT *.geojson, so it stays internal to output/ (not published).
    handoff:
      glob:
        - src_dir:  output
          dest_dir: website/public/data/amenities
          pattern:  "*.geojson"
      files:
        - { from: output/manifest.json, to: website/public/data/amenities/manifest.json }

  zoning:
    cwd: pipeline/yeg/zoning

    # 01 fetches the Zoning Bylaw parent dataset (fixa-tstc), groups the 156 zone
    # codes into 10 families via the RATIFIED crosswalk (halting on any unmapped
    # or blank code — §4.7), and emits the parcels + the family-boundary dissolve;
    # 03 emits the no-year currency manifest. (02 intentionally unused: RESERVED
    # for the deferred Z2 overlays emitter — v1.1; 03 = manifest, the convention.)
    scripts:
      - scripts/production/01_build_zoning.R
      - scripts/production/03_emit_manifest.R

    # Representative non-empty guards; the handoff zero-byte check backstops every file.
    expected_outputs:
      scripts/production/01_build_zoning.R:
        - output/zoning_bylaw.geojson
        - output/zoning_family_boundaries.geojson
      scripts/production/03_emit_manifest.R:
        - output/manifest.json

    # --- Handoff (Way A: glob + fixed-file copy) --------------------------------
    # Both layer GeoJSONs publish via the year-free "*.geojson" glob; the manifest
    # is a fixed-file copy. The build log (_log_zoning_bylaw.csv) is NOT *.geojson,
    # so it stays internal to output/ (not published).
    handoff:
      glob:
        - src_dir:  output
          dest_dir: website/public/data/zoning
          pattern:  "*.geojson"
      files:
        - { from: output/manifest.json, to: website/public/data/zoning/manifest.json }
